<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>GameJam2026</title>
    <link rel="icon" href="./favicon.ico">
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      iframe {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        border: 0;
        background: #000;
      }

      .local-help {
        box-sizing: border-box;
        display: grid;
        min-height: 100%;
        place-items: center;
        padding: 24px;
        color: #f5f5f5;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.45;
        text-align: center;
      }

      .local-help p {
        max-width: 640px;
        margin: 0;
      }

      .local-help code {
        color: #9ee493;
      }
    </style>
  </head>
  <body>
    <iframe
      id="unity-build"
      title="GameJam2026 Unity Build"
      allow="autoplay; fullscreen; gamepad; xr-spatial-tracking; clipboard-read; clipboard-write"
      allowfullscreen
    ></iframe>

    <script>
      const params = new URLSearchParams(window.location.search);
      const buildUrl = params.get("src") || "./build/index.html";
      const iframe = document.getElementById("unity-build");
      const forwardedParamNames = new Set([
        "device",
        "platform",
        "mobile",
        "dyncontrolsMobile",
        "mobileControls",
        "touchControls",
        "itchio_device",
      ]);

      function appendForwardedParams(url) {
        const target = new URL(url, window.location.href);

        params.forEach((value, key) => {
          if (forwardedParamNames.has(key)) {
            target.searchParams.set(key, value);
          }
        });

        return target.href;
      }

      if (window.location.protocol === "file:") {
        iframe.remove();
        document.body.innerHTML = '<main class="local-help"><p>Para probar este wrapper con iframe, abre <code>http://localhost:8080/</code>. Los navegadores bloquean iframes locales cuando la pagina se abre como <code>file://</code>.</p></main>';
      } else {
        iframe.src = appendForwardedParams(buildUrl);
      }
    </script>
  </body>
</html>
